name: Browser checks (local fixtures)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run component and worker checks
        run: npm run test:browser

      - name: Run production Next routing and reader checks
        run: npm run test:next-browser

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nook-browser-artifacts
          path: |
            artifacts/browser/
            artifacts/next-browser/
          if-no-files-found: ignore
          retention-days: 7
